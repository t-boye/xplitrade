<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/xplitrade_logo.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XplitradeUI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script>
    // Apply saved theme before React mounts to prevent flash
    (function() {
      var t = localStorage.getItem('xp-theme') || 'light';
      if (t === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body class="bg-xp-bg dark:bg-xp-dbg">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
